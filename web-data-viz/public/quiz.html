<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/0f81e65dc9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/styleIndex.css">
    <title>Projeto Look for the light | quiz</title>
</head>

<body onload="verificarQuiz()">

    <header>
        <div class="container">
            <div class="navbar">
                <div class="logo">
                    <img src="img/logoImg.png" alt="logo Look for the light">
                </div>
                <ul id="lista-navbar" class="links">


                </ul>
            </div>
        </div>
    </header>


    <div class="fundo-quiz">
        <div class="quiz-page">

            <div class="quiz-card">
                <span id="contador_pergunta" class="quiz-tag">Quiz Personalidade</span>

                <h2 id="pergunta">Carregando pergunta...</h2>

                <div class="opcoes" id="opcoes"></div>

                <div id="resultado_quiz" class="resultado-quiz none"></div>

                <button id="btn_proxima" class="btn-proxima none" onclick="proximaPergunta()">
                    Próxima
                </button>
            </div>
        </div>
    </div>
</body>

<script src="./navbar.js"></script>
<script>

    alterarNavbar();

    let perguntas = [];
    let pontosPersonagem = [];
    let pontosPerfil = [];
    let perguntaAtual = 0;
    let respondeu = false;

    function buscarPerguntas() {

        fetch("/quiz/listarPerguntas", {
            method: "GET"
        })
            .then(function (resposta) {

                if (resposta.ok) {

                    resposta.json().then(function (dados) {

                        organizarPerguntas(dados);
                        carregarPergunta();

                    });

                }

            })
            .catch(function (erro) {

                console.log("ERRO: ", erro);

            });
    }

    function organizarPerguntas(perguntasRecebidas) {

        let perguntasOrganizadas = [];

        for (let i = 0; i < perguntasRecebidas.length; i++) {

            let linha = perguntasRecebidas[i];

            let idPergunta = linha.idPerguntas;
            let pergunta_existe = false;
            let pergunta_indice = -1;

            for (let b = 0; b < perguntasOrganizadas.length; b++) {
                if (perguntasOrganizadas[b].idPergunta == idPergunta) {
                    pergunta_existe = true;
                    pergunta_indice = b
                    break
                }
            }

            if (pergunta_existe) {
                perguntasOrganizadas[pergunta_indice].opcoes.push({
                    texto: linha.alternativa,
                    personagem: linha.personagem,
                    pontos: linha.pontos,
                    perfil: linha.perfil
                });
            } else {
                perguntasOrganizadas.push({
                    idPergunta: idPergunta,
                    pergunta: linha.pergunta,
                    opcoes: [{
                        texto: linha.alternativa,
                        personagem: linha.personagem,
                        pontos: linha.pontos,
                        perfil: linha.perfil
                    }]
                });
            }

            let personagem_existe = false;

            for (let r = 0; r < pontosPersonagem.length; r++) {
                if (pontosPersonagem[r].nome == linha.personagem) {
                    personagem_existe = true;
                    break
                }
            }

            if (!personagem_existe) {
                pontosPersonagem.push({
                    "nome": linha.personagem,
                    "pontos": 0,
                    "descricao": linha.personagem_descricao,
                    "idPersonagem": linha.idPersonagem
                })
            }

            let perfil_existe = false;

            for (let r = 0; r < pontosPerfil.length; r++) {
                if (pontosPerfil[r].nome == linha.perfil) {
                    perfil_existe = true;
                    break
                }
            }

            if (!perfil_existe) {
                pontosPerfil.push({
                    "nome": linha.perfil,
                    "pontos": 0,
                    "idPerfil": linha.idPerfil
                })
            }
        }

        console.log(perguntasOrganizadas);
        perguntas = perguntasOrganizadas;
    }

    function carregarPergunta() {

        respondeu = false;

        let perguntaAtualObj = perguntas[perguntaAtual];

        contador_pergunta.innerHTML =
            `Pergunta ${perguntaAtual + 1} de ${perguntas.length}`;

        pergunta.innerHTML = perguntaAtualObj.pergunta;

        console.log(perguntaAtualObj);

        resultado_quiz.classList.add("none");

        btn_proxima.classList.add("none");

        opcoes.innerHTML = "";

        for (let i = 0; i < perguntaAtualObj.opcoes.length; i++) {

            let opcao = perguntaAtualObj.opcoes[i];

            opcoes.innerHTML += `
        
            <button 
                class="opcao-btn"
                onclick="responder(${i}, this)">
                
                ${opcao.texto}

            </button>

        `;
        }
    }



    function responder(indice, botao) {

        respondeu = true;

        let botoes = document.querySelectorAll(".opcao-btn");

        for (let i = 0; i < botoes.length; i++) {
            botoes[i].classList.remove("opcao-selecionada");
        }

        botao.classList.add("opcao-selecionada");

        let opcaoSelecionada =
            perguntas[perguntaAtual].opcoes[indice];

        let personagem = opcaoSelecionada.personagem;
        let pontos = opcaoSelecionada.pontos;

        let perfil = opcaoSelecionada.perfil;



        for (let i = 0; i < pontosPersonagem.length; i++) {
            if (pontosPersonagem[i].nome == personagem) {
                pontosPersonagem[i].pontos += pontos;
            }
        }

        for (let i = 0; i < pontosPerfil.length; i++) {
            if (pontosPerfil[i].nome == perfil) {
                pontosPerfil[i].pontos += pontos;
            }
        }

        btn_proxima.classList.remove("none");
    }

    function proximaPergunta() {

        perguntaAtual++;

        if (perguntaAtual < perguntas.length) {

            carregarPergunta();

        } else {

            finalizarQuiz();

        }
    }

    function finalizarQuiz() {

        let personagemFinal = "";
        let maiorPontuacaoPersonagem = 0;
        let personagem_descricao = "";

        let perfilFinal = "";
        let maiorPontuacaoPerfil = 0;


        for (let i = 0; i < pontosPersonagem.length; i++) {

            if (pontosPersonagem[i].pontos > maiorPontuacaoPersonagem) {

                maiorPontuacaoPersonagem = pontosPersonagem[i].pontos;

                personagemFinal = pontosPersonagem[i].nome;

                personagem_descricao = pontosPersonagem[i].descricao;

            }
        }

        for (let i = 0; i < pontosPerfil.length; i++) {

            if (pontosPerfil[i].pontos > maiorPontuacaoPerfil) {

                maiorPontuacaoPerfil = pontosPerfil[i].pontos;

                perfilFinal = pontosPerfil[i].nome;

            }
        }
        console.log(pontosPersonagem);
        console.log(pontosPerfil);

        pergunta.innerHTML = "";

        contador_pergunta.innerHTML = "Resultado final";

        opcoes.innerHTML = `
        
            <div class="quiz-final">

                <h3>
                    VOCÊ É ${personagemFinal.toUpperCase()}
                </h3>

                <p>
                    ${personagem_descricao} <br>
                    Pontuação total: ${maiorPontuacaoPersonagem}
                </p>
                <p>
                    Perfil: ${perfilFinal}<br>
                    Pontuação Total: ${maiorPontuacaoPerfil}
                </p>

            </div>

        `;

        resultado_quiz.classList.add("none");

        btn_proxima.classList.add("none");

        fetch("/quiz/salvarResultado", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUsuarioServer: sessionStorage.ID_USUARIO
            })
        })
            .then(function (resposta) {

                return resposta.json();

            })
            .then(function (dados) {

                console.log(dados);

                let idResultado = dados.idResultado;

                console.log("ID RESULTADO:", idResultado);

                salvarResultadoPersonagem(idResultado);
                salvarResultadoPerfil(idResultado);
                sessionStorage.RESPONDEU_QUIZ = "true";

            })
            .catch(function (erro) {

                console.log(erro);

            });
    }

    buscarPerguntas();

    function salvarResultadoPersonagem(idResultado) {

        for (let i = 0; i < pontosPersonagem.length; i++) {

            let personagemAtual = pontosPersonagem[i];

            fetch("/quiz/salvarResultadoPersonagem", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({

                    idResultadoServer: idResultado,
                    idPersonagemServer: personagemAtual.idPersonagem,
                    pontosServer: personagemAtual.pontos

                })
            })
                .then(function (resposta) {

                    if (resposta.ok) {
                        console.log(`Resultado Personagem salvo ${personagemAtual.nome}`);
                    }

                })
                .catch(function (erro) {
                    console.log(erro);
                });
        }
    }

    function salvarResultadoPerfil(idResultado) {

        for (let i = 0; i < pontosPerfil.length; i++) {

            let perfilAtual = pontosPerfil[i];

            fetch("/quiz/salvarResultadoPerfil", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({

                    idResultadoServer: idResultado,
                    idPerfilServer: perfilAtual.idPerfil,
                    pontosServer: perfilAtual.pontos

                })
            })
                .then(function (resposta) {

                    if (resposta.ok) {
                        console.log(`Resultado Perfil salvo ${perfilAtual.nome}`);
                    }

                })
                .catch(function (erro) {
                    console.log(erro);
                });
        }
    }

    // verificar se o usuário ja respondeu o quiz
    function verificarQuiz() {

        // o sessionStorage sempre salva como string, não como verdadeiro ou false
        if (sessionStorage.RESPONDEU_QUIZ == "true") {
            alert("Você já respondeu esse quiz, para verificar seu resultado, estamos te redirecionando para a dashboard")
            window.location = "./dashboards.html"
        }
    }

</script>



</html>
