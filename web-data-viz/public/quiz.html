<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/0f81e65dc9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/styleIndex.css">
    <title>Projeto Look for the light | quiz</title>
</head>

<body>

    <header>
        <div class="container">
            <div class="navbar">
                <div class="logo">
                    <img src="img/logoImg.png" alt="logo Look for the light">
                </div>
                <ul id="lista-navbar" class="links">


                </ul>
            </div>
        </div>
    </header>

    <div class="quiz-page">

        <div class="quiz-card">
            <span id="contador_pergunta" class="quiz-tag">Quiz Personalidade</span>

            <h2 id="pergunta">Carregando pergunta...</h2>

            <div class="opcoes" id="opcoes"></div>

            <div id="resultado_quiz" class="resultado-quiz none"></div>

            <button id="btn_proxima" class="btn-proxima none" onclick="proximaPergunta()">
                Próxima
            </button>
        </div>

    </div>
    <script src="./navbar.js"></script>
    <script>
        alterarNavbar();

        let perguntas = [
            {
                pergunta: "Quando Joel teve que escolher entre salvar Ellie ou a humanidade, o que você faria?",

                opcoes: [
                    "Salvaria quem eu amo, independente das consequências",
                    "Pensaria no bem maior, mesmo sendo difícil",
                    "Tentaria encontrar uma solução alternativa",
                    "Ficaria emocionalmente dividido"
                ],

                correta: 0,

                personagem: "Joel"
            },

            {
                pergunta: "Você continuaria uma jornada mesmo sabendo que pode perder tudo?",

                opcoes: [
                    "Sim, iria até o fim",
                    "Só se fosse por alguém importante",
                    "Depende do que está em jogo",
                    "Não, prefiro preservar o que tenho"
                ],

                correta: 1,

                personagem: "Abby"
            },

            {
                pergunta: "Se você pudesse apagar um erro do passado:",

                opcoes: [
                    "Faria qualquer coisa para mudar",
                    "Mudaria, mas aceito as consequências",
                    "Não mudaria, me tornou mais forte",
                    "Aprenderia com ele e seguiria em frente"
                ],

                correta: 3,

                personagem: "Lev"
            },

            {
                pergunta: "Em um mundo caótico, o que mais te guia?",

                opcoes: [
                    "Proteger quem eu amo",
                    "Fazer o que é certo",
                    "Buscar justiça",
                    "Manter equilíbrio e segurança"
                ],

                correta: 0,

                personagem: "Joel"
            }
        ];

        let perguntaAtual = 0;
        let respondeu = false;

        function carregarPergunta() {

            respondeu = false;

            let perguntaObj = perguntas[perguntaAtual];

            pergunta.innerHTML = perguntaObj.pergunta;

            contador_pergunta.innerHTML =
                `Pergunta ${perguntaAtual + 1} de ${perguntas.length}`;

            resultado_quiz.classList.add("none");

            btn_proxima.classList.add("none");

            opcoes.innerHTML = "";

            for (let i = 0; i < perguntaObj.opcoes.length; i++) {

                opcoes.innerHTML += `
        
            <button class="opcao-btn" onclick="responder(${i}, this)">
                ${perguntaObj.opcoes[i]}
            </button>

        `;
            }
        }

        function responder(indice, botao) {

            if (respondeu) return;

            respondeu = true;

            let botoes = document.querySelectorAll(".opcao-btn");

            for (let i = 0; i < botoes.length; i++) {
                botoes[i].classList.remove("opcao-selecionada");
            }

            botao.classList.add("opcao-selecionada");

            resultado_quiz.innerHTML =
                `Essa resposta se aproxima mais de: ${perguntas[perguntaAtual].personagem}`;

            resultado_quiz.classList.remove("none");

            btn_proxima.classList.remove("none");
        }

        function proximaPergunta() {

            perguntaAtual++;

            if (perguntaAtual < perguntas.length) {

                carregarPergunta();

            } else {

                finalizarQuiz();

            }

        }

       function finalizarQuiz() {

    let personagemFinal = "Joel";

    pergunta.innerHTML = "";

    contador_pergunta.innerHTML = "Resultado final";

    opcoes.innerHTML = `
    
        <div class="quiz-final">

            <img src="img/pers/joel1-icon.png">

            <h3>
                VOCÊ É O JOEL
            </h3>

            <h4>
                Protetor, intenso e disposto a tudo por quem ama.
            </h4>

            <p>
                Assim como Joel, você é alguém extremamente leal às pessoas
                importantes da sua vida. Mesmo em situações difíceis, suas
                escolhas costumam ser guiadas pelo sentimento e pela proteção
                daqueles que você ama.
            </p>

    

        </div>

    `;

    resultado_quiz.classList.add("none");

    btn_proxima.classList.add("none");

}

        carregarPergunta();
    </script>

</body>

</html>
